<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <div class="result">
        <h2>Your Result</h2>

        <div class="circle">
          <span class="score">76</span>
          <span class="total">of 100</span>
        </div>

        <div class="text">
          <h3>Great</h3>
          <p>
            You scored higher than 65% of<br />
            the people who have taken<br />
            these tests.
          </p>
        </div>
      </div>
      <div class="summary">
        <h2>Summary</h2>
        <ul>
          <li class="reaction">
            <div class="category">
              <img
                src="./assets/images/icon-reaction.svg"
                alt="reaction icon"
              />
              <span class="title">Reaction</span>
            </div>
            <span class="summary-score"
              >80 <span class="total-score">/ 100</span></span
            >
          </li>
          <li class="memory">
            <div class="category">
              <img src="./assets/images/icon-memory.svg" alt="memory icon" />
              <span class="title">Memory</span>
            </div>

            <span class="summary-score"
              >92 <span class="total-score">/ 100</span></span
            >
          </li>
          <li class="verbal">
            <div class="category">
              <img src="./assets/images/icon-verbal.svg" alt="verbal icon" />
              <span class="title">Verbal</span>
            </div>
            <span class="summary-score"
              >61 <span class="total-score">/ 100</span></span
            >
          </li>
          <li class="visual">
            <div class="category">
              <img src="./assets/images/icon-visual.svg" alt="visual icon" />
              <span class="title">Visual</span>
            </div>
            <span class="summary-score"
              >72 <span class="total-score">/ 100</span></span
            >
          </li>
        </ul>
        <button class="continue">Continue</button>
      </div>
    </div>
  </body>
</html>
